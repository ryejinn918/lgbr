[project]
name = "lgbr"
version = "0.1.0"
description = "LGBR monorepo workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crawler",
    "lgbr-api",
    "lgbr-mcp",
    "consensus",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
crawler = { workspace = true }
lgbr-api = { workspace = true }
lgbr-mcp = { workspace = true }
consensus = { workspace = true }

[tool.uv.workspace]
members = [
    "crawler",
    "api",
    "mcp",
    "consensus",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
