[project]
name = "crawler"
version = "0.1.0"
description = "Fnguide login, search, and download automation"
readme = "README.md"
authors = [
    { name = "taehee", email = "ktthee1995@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "browserforge>=1.2.4",
    "curl-cffi>=0.15.0",
    "httpx>=0.28.1",
    "patchright>=1.61.2",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
]

[project.scripts]
crawler = "crawler.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
