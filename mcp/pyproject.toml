[project]
name = "lgbr-mcp"
version = "0.1.0"
description = "Claude Enterprise MCP connectors for LGBR collect and consensus (read-only)"
readme = "README.md"
authors = [
    { name = "taehee", email = "ktthee1995@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lgbr-api",
    "mcp>=2.0.0",
    "python-dotenv>=1.2.2",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
lgbr-mcp = "lgbr_mcp.__main__:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"
